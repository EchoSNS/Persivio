# cargo-deny configuration (format of cargo-deny 0.22, from `cargo deny init`).
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Empty = check dependencies for every target, so Windows-only and macOS-only crates are
# covered even when CI runs `cargo deny` on Linux.
targets = []
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec advisory DB. Vulnerabilities, unmaintained and unsound crates fail the check.
# Any entry added to `ignore` must carry a comment with the reason and a review date.
ignore = [
    # ringbuf 0.4.8 (via librqbit -> librqbit-utp, pinned to ^0.4.7): Consumer::skip/clear
    # double free only if an element's Drop panics. librqbit-utp's only buffer holds `u8`
    # (Drop cannot panic), and Persivio runs librqbit TcpOnly (uTP unused). Not reachable.
    # Review: when librqbit updates librqbit-utp, or by 2027-02-23.
    { id = "RUSTSEC-2026-0293", reason = "unreachable: u8 elements, uTP disabled; see comment" },
]

[licenses]
# Only licenses actually present in the dependency graph (cargo-deny warns on unused
# entries). When a new crate brings a new license, check it before adding it here.
# Prefer a per-crate `exceptions` entry for anything copyleft (e.g. MPL-2.0).
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon (Linux GTK build tooling via system-deps), added Phase 7
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", # Inflector (specta-macros, desktop), added Phase 7
    "BSL-1.0", # clipboard-win, error-code (Windows clipboard via tauri-plugin-clipboard-manager), Phase 9
    "CC0-1.0", # tiny-keccak (public domain; build-time macro via rust-ini <- tauri-plugin-deep-link), Phase 9
    "BSD-3-Clause", # matchit (axum router, dev-only via pv-testkit), added Phase 2
    "CDLA-Permissive-2.0", # webpki-root-certs (Mozilla CA data, via rustls), added Phase 3
    "ISC", # rustls, rustls-webpki, aws-lc-rs, untrusted, added Phase 3
    "Unicode-3.0",
    "Zlib", # foldhash (via sqlx -> hashbrown), added Phase 1
]
confidence-threshold = 0.8
exceptions = [
    # MPL-2.0 is file-level copyleft: obligations cover only option-ext's own (unmodified)
    # source files, available on crates.io. Pulled in by `directories` (CLI), Phase 5.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Same reasoning: unmodified HTML/CSS parsing crates that Tauri uses to process the
    # frontend (tauri-utils -> dom_query), Phase 7.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
# Our own workspace crates are `publish = false`; don't require them to match `allow`.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
# Disallow `*` version requirements, but allow path-only deps between our private crates.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # TLS must go through rustls (security checklist, section 11).
    { name = "openssl-sys", reason = "use rustls; no system OpenSSL" },
]
skip = []
skip-tree = []

[sources]
# Only crates.io; any git or alternative-registry dependency must be added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
