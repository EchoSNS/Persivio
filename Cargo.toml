[workspace]
resolver = "3"
members = [
    "crates/pv-core",
    "crates/pv-http",
    "crates/pv-torrent",
    "crates/pv-store",
    "crates/pv-engine",
    "crates/pv-testkit",
    "apps/cli",
    "apps/desktop/src-tauri",
]
# Fuzz targets build with nightly + cargo-fuzz in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EchoSNS/Persivio"
publish = false

# Shared dependency versions. Only crates that a member actually uses are listed:
# Cargo warns on unused entries, and each phase adds (and re-checks on crates.io)
# the crates it introduces. Versions below checked on 2026-11-22.
[workspace.dependencies]
# Internal crates
pv-torrent = { path = "crates/pv-torrent" }
pv-http = { path = "crates/pv-http" }
pv-store = { path = "crates/pv-store" }
pv-testkit = { path = "crates/pv-testkit" }
pv-core = { path = "crates/pv-core" }
pv-engine = { path = "crates/pv-engine" }

# Async
async-trait = "0.1.92"
bytes = "1.12.2"
futures = "0.3.34"
tokio = "1.54.1"
tokio-util = "0.7.20"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"

# Data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.9", features = ["serde"] }
percent-encoding = "2.3.2"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

# HTTP (reqwest features are chosen per crate)
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false }

# BitTorrent (only pv-torrent may use it, ADR-006). rust-tls: no OpenSSL.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }

# Disk
fs4 = "1.1.0"
directories = "6.0.0"
# std clock (std::time::Instant): the default `quanta` TSC clock ran ~2x slow on macOS CI VMs.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
indicatif = "0.18.6"

# Hashing / compression
flate2 = "1.1.11"
sha2 = "0.11.1"
md-5 = "0.11.0"

# Persistence
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Desktop app (Tauri v2). tauri-specta 2 is a release candidate and requires an exact
# specta pin (`=`): its API changes between candidates. Checked on 2026-11-23.
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"

# Testing
criterion = { version = "0.8.2", default-features = false }
proptest = "1.12.0"
tempfile = "3.27.0"

# CLI
clap = { version = "4.6.9", features = ["derive", "env"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
# priority -1 so the individual lints below can override group members.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
