[package]
name = "pv-store"
description = "Persivio SQLite persistence (sqlx)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes fault injection for other crates' tests.
testing = []

[dependencies]
async-trait = { workspace = true }
url = { workspace = true }
pv-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Self-dependency: our own tests always build with `testing` enabled.
pv-store = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
