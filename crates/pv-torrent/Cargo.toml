[package]
name = "pv-torrent"
description = "Persivio BitTorrent adapter over librqbit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes `testing::LocalSeeder` for other crates' tests.
testing = []

[dependencies]
async-trait = { workspace = true }
fs4 = { workspace = true }
librqbit = { workspace = true }
pv-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Self-dependency: our own tests always build with `testing` enabled.
pv-torrent = { path = ".", features = ["testing"] }
async-trait = { workspace = true }
pv-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
