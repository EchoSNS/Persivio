name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debug info is the bulk of target/; the Linux linker died with SIGBUS (most likely
  # a full disk). Line tables keep backtraces readable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Versions and changelog agree
        run: node scripts/release-check.mjs
      - name: Update manifest tests
        run: node --test scripts/lib/*.test.mjs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Uses deny.toml at the repo root; checks advisories, bans, licenses and sources.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The desktop app (Tauri) needs WebKitGTK on Linux, and its frontend must be
      # built before Rust compiles: `generate_context!` embeds apps/desktop/build.
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend install, type check, tests, build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Browser extension tests
        working-directory: extension
        run: npm test
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (nextest)
        run: cargo nextest run --workspace --locked
      # Phase 11: a full disk must fail cleanly. Needs a small file system.
      - name: Disk-full tests (24 MiB tmpfs)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=24m,mode=1777 tmpfs /mnt/small
          PERSIVIO_SMALL_DISK=/mnt/small cargo nextest run -p pv-engine --test hardening --locked --run-ignored only
      # nextest does not run doctests; run them separately.
      - name: Doctests
        run: cargo test --workspace --doc --locked
      - name: Disk space
        if: always()
        shell: bash
        run: df -h .

