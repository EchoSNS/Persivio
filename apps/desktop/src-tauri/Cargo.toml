[package]
name = "persivio-desktop"
description = "Persivio desktop app (Tauri shell over pv-engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "persivio_desktop"
crate-type = ["rlib"]

[[bin]]
name = "persivio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
pv-core = { workspace = true }
pv-engine = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-specta = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
# `log`: without a tracing subscriber, the engine's tracing events reach tauri-plugin-log.
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
