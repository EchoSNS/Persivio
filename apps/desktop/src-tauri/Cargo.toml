[package]
name = "persivio-desktop"
description = "Persivio desktop app (Tauri shell over pv-engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "persivio_desktop"
crate-type = ["rlib"]

[[bin]]
name = "persivio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
keepawake = { workspace = true }
pv-core = { workspace = true }
pv-engine = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-specta = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "net"] }
tokio-util = { workspace = true }
# `log`: without a tracing subscriber, the engine's tracing events reach tauri-plugin-log.
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
minisign = { workspace = true }
pv-testkit = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "test-util"] }
tower = { workspace = true }

[lints]
workspace = true
